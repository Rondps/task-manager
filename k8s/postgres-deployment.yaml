apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: task-manager

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:15

          ports:
            - containerPort: 5432

          envFrom:
            - configMapRef:
                name: task-manager-config

            - secretRef:
                name: task-manager-secret